<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb547">
<title>あたまの体操クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #ffb547;
    --sun-deep: #f28c28;
    --red: #ef5b5b;
    --ok: #2fae6b;
    --blue: #3b8de0;
    --ink: #3a2e25;
    --sub: #8a7766;
    --card: #fffdf8;
    --line: #f1e2cc;
    --tile: #fff3df;
    --shadow: 0 6px 0 rgba(160, 100, 40, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
    font-weight: 500;
    font-size: 20px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    background-color: #fff6e6;
    background-image:
      radial-gradient(circle at 20px 20px, rgba(255, 181, 71, .18) 6px, transparent 7px),
      radial-gradient(circle at 60px 60px, rgba(239, 91, 91, .10) 6px, transparent 7px);
    background-size: 80px 80px;
  }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  button {
    font: inherit; font-weight: 800; border: none; border-radius: 18px; padding: 16px; width: 100%;
    cursor: pointer; touch-action: manipulation; transition: transform .08s;
  }
  button:active { transform: translateY(3px); }
  button:disabled { opacity: .4; cursor: default; transform: none; }
  [hidden] { display: none !important; }

  /* 音のボタン */
  .sound-toggle {
    position: fixed; top: 10px; right: 10px; z-index: 50; width: auto;
    padding: 8px 14px; font-size: 16px; border-radius: 999px;
    background: #fff; color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.1);
  }

  /* はじめの画面 */
  .hero { text-align: center; padding-top: 28px; }
  .hero img { width: 62%; max-width: 260px; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .logo { font-size: 38px; font-weight: 800; line-height: 1.25; margin: 8px 0 4px; letter-spacing: .02em; }
  .logo span { display: inline-block; }
  .logo .c1 { color: var(--red); } .logo .c2 { color: var(--sun-deep); } .logo .c3 { color: var(--ok); } .logo .c4 { color: var(--blue); }
  .tagline { color: var(--sub); margin: 0 0 20px; }
  .btn-start {
    background: linear-gradient(#ff8a5b, var(--red)); color: #fff; font-size: 30px;
    box-shadow: 0 7px 0 #c23f3f; padding: 18px; animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.03); } }
  .best { text-align: center; margin: 14px 0 0; color: var(--sub); }
  .best b { color: var(--sun-deep); font-size: 26px; }
  .genres { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 24px 0 10px; }
  .genres div { text-align: center; font-size: 12px; color: var(--sub); line-height: 1.3; }
  .genres img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 16px; padding: 6px; box-shadow: var(--shadow); }
  .rules { background: var(--card); border-radius: 20px; padding: 16px 18px; margin-top: 16px; box-shadow: var(--shadow); font-size: 17px; }
  .rules p { margin: 4px 0; }
  .rules b { color: var(--red); }
  .family-box { display: flex; align-items: center; gap: 12px; margin-top: 16px; background: var(--card); border-radius: 20px; padding: 12px 16px; box-shadow: var(--shadow); }
  .family-box img { width: 64px; }
  .family-box .txt { flex: 1; font-size: 16px; }
  .family-box button { width: auto; padding: 10px 14px; font-size: 15px; background: #f3e7d6; color: var(--ink); }
  .credit { text-align: center; color: var(--sub); font-size: 12px; margin-top: 24px; }

  /* 出題 */
  .hud { display: flex; align-items: center; gap: 10px; margin: 6px 124px 12px 0; min-height: 36px; }
  .dots { display: flex; gap: 5px; flex: 1; }
  .dots i { flex: 1; height: 10px; border-radius: 99px; background: #f0dcc0; }
  .dots i.done { background: var(--sun); }
  .dots i.now { background: var(--red); }
  .score-pill { background: #fff; border-radius: 999px; padding: 2px 14px; font-weight: 800; color: var(--sun-deep); box-shadow: 0 3px 0 rgba(0,0,0,.08); white-space: nowrap; }
  .qcard { background: var(--card); border-radius: 26px; padding: 18px 18px 20px; box-shadow: var(--shadow); position: relative; }
  .qhead { display: flex; align-items: center; gap: 12px; }
  .qhead img { width: 64px; height: 64px; object-fit: contain; }
  .chip { display: inline-block; background: var(--sun); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 15px; font-weight: 800; }
  .qnum { color: var(--sub); font-size: 15px; }
  .question { font-size: 25px; font-weight: 800; line-height: 1.45; margin: 12px 0 6px; }
  .clue { display: flex; gap: 8px; align-items: flex-start; background: #eef6ff; color: #2a5f99; border-radius: 14px; padding: 8px 12px; font-size: 17px; margin: 0; }

  .boxes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 20px 0 16px; }
  .boxes span {
    width: 46px; height: 54px; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; background: var(--tile); border: 2px dashed #e9cfa8;
    font-size: 28px; font-weight: 800;
  }
  .boxes.long span { width: 36px; height: 44px; font-size: 22px; border-radius: 10px; }
  .boxes span.open { background: var(--sun-deep); color: #fff; border: none; box-shadow: 0 3px 0 #c76a14; }
  .boxes span.hinted { background: var(--blue); color: #fff; border: none; box-shadow: 0 3px 0 #2a6cb0; animation: pop .35s; }
  .boxes span.ans { background: var(--ok); color: #fff; border: none; box-shadow: 0 3px 0 #22804f; animation: pop .35s backwards; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

  .answer-line { display: flex; align-items: center; gap: 6px; background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 4px 4px 4px 14px; }
  .answer-line:focus-within { border-color: var(--sun-deep); }
  .prefix { font-size: 28px; font-weight: 800; color: var(--sun-deep); white-space: nowrap; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 26px; font-weight: 700; padding: 10px 6px; border: none; background: transparent; color: var(--ink); }
  input[type=text]:focus { outline: none; }
  .msg { min-height: 1.6em; text-align: center; font-weight: 800; font-size: 20px; margin: 10px 0 6px; color: var(--red); }
  .btn-answer { background: linear-gradient(#ff8a5b, var(--red)); color: #fff; font-size: 26px; box-shadow: 0 6px 0 #c23f3f; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row > button { flex: 1; font-size: 18px; padding: 12px 6px; white-space: nowrap; }
  .btn-hint { background: #e3f0ff; color: var(--blue); box-shadow: 0 4px 0 #bcd6f3; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .btn-hint img { width: 30px; height: 30px; object-fit: contain; }
  .btn-giveup { background: #f3e7d6; color: var(--ink); box-shadow: 0 4px 0 #e0ccb0; }
  .worth { text-align: center; color: var(--sub); font-size: 17px; margin: 14px 0 0; }
  .worth b { color: var(--sun-deep); font-size: 30px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  .done { text-align: center; }
  .done .reveal { font-size: 28px; font-weight: 800; margin: 4px 0 2px; }
  .done .gain { font-size: 22px; font-weight: 800; color: var(--ok); margin: 0 0 14px; }
  .btn-next { background: linear-gradient(#4fc7ff, var(--blue)); color: #fff; font-size: 26px; box-shadow: 0 6px 0 #2a6cb0; }

  /* 正解・不正解の大きな絵 */
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 40; }
  .overlay img { width: 62vw; max-width: 280px; animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1) both; filter: drop-shadow(0 8px 12px rgba(0,0,0,.18)); }
  .overlay.out img { animation: fade .3s forwards; }
  @keyframes stamp { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes fade { to { transform: scale(.8); opacity: 0; } }
  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 39; pointer-events: none; animation: fall linear forwards; border-radius: 2px; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* 結果 */
  .result { text-align: center; padding-top: 20px; }
  .result h2 { font-size: 30px; margin: 0; }
  .result .kusudama { width: 52%; max-width: 220px; }
  .drum { font-size: 22px; color: var(--sub); min-height: 1.6em; }
  .final { font-size: 80px; font-weight: 800; color: var(--red); line-height: 1.1; margin: 0; }
  .final small { font-size: 30px; }
  .rank { font-size: 24px; font-weight: 800; margin: 8px 0 4px; }
  .record { color: var(--sub); margin: 0 0 18px; }
  .record.new { color: var(--sun-deep); font-weight: 800; }
  .res { background: var(--card); border-radius: 20px; padding: 6px 14px; box-shadow: var(--shadow); text-align: left; margin-bottom: 18px; }
  .res div { display: flex; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 16px; }
  .res div:last-child { border-bottom: none; }
  .res .q { flex: 1; }
  .res .a { display: block; font-weight: 800; font-size: 18px; }
  .res .p { font-weight: 800; color: var(--sun-deep); white-space: nowrap; align-self: center; }
  .res .p.zero { color: #bbb; }
  .stack > * + * { margin-top: 12px; }
  .btn-sub { background: #f3e7d6; color: var(--ink); box-shadow: 0 4px 0 #e0ccb0; }
  .btn-danger { background: #fde4e4; color: var(--red); width: auto; padding: 8px 14px; font-size: 15px; }

  /* 家族の問題 */
  .panel { background: var(--card); border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow); margin: 16px 0; }
  .panel h2 { margin: 0 0 8px; font-size: 24px; display: flex; align-items: center; gap: 10px; }
  .panel h2 img { width: 56px; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  ul.list li:last-child { border-bottom: none; }
  .note { color: var(--sub); font-size: 16px; }
</style>
</head>
<body>
<button class="sound-toggle" id="soundBtn"></button>
<main>

  <!-- はじめ -->
  <section id="home">
    <div class="hero">
      <img src="assets/img/title.webp" alt="">
      <div class="logo"><span class="c1">あ</span><span class="c2">た</span><span class="c3">ま</span><span class="c4">の</span><br><span class="c2">体操</span><span class="c1">クイズ</span></div>
      <p class="tagline">さいしょの1文字から、のこりを思い出そう！</p>
    </div>
    <button class="btn-start" id="startBtn">はじめる</button>
    <p class="best" id="bestText"></p>

    <div class="genres">
      <div><img src="assets/img/owarai.webp" alt="">お笑い</div>
      <div><img src="assets/img/idol.webp" alt="">アイドル</div>
      <div><img src="assets/img/ryukogo.webp" alt="">流行語</div>
      <div><img src="assets/img/drama.webp" alt="">ドラマ</div>
      <div><img src="assets/img/family.webp" alt="">家族</div>
    </div>

    <div class="rules">
      <p>・ぜんぶで <b>10問</b></p>
      <p>・のこりの文字 1つにつき <b>10点</b></p>
      <p>・ヒントで次の文字が出ます（<b>10点へる</b>）</p>
      <p>・ひらがなでもカタカナでもOK</p>
    </div>

    <div class="family-box">
      <img src="assets/img/family.webp" alt="">
      <div class="txt" id="familyCount"></div>
      <button id="manageBtn">見る</button>
    </div>
    <p class="credit">イラスト：いらすとや　効果音：効果音ラボ</p>
  </section>

  <!-- 出題 -->
  <section id="play" hidden>
    <div class="hud">
      <div class="dots" id="dots"></div>
      <span class="score-pill" id="total"></span>
    </div>
    <div class="qcard" id="qcard">
      <div class="qhead">
        <img id="catImg" alt="">
        <div>
          <span class="chip" id="cat"></span>
          <div class="qnum" id="progress"></div>
        </div>
      </div>
      <p class="question" id="qText"></p>
      <p class="clue" id="qClue"></p>
      <div class="boxes" id="boxes"></div>

      <div id="answerArea">
        <div class="answer-line" id="answerLine">
          <span class="prefix" id="prefix"></span>
          <input type="text" id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="つづきを入力" enterkeyhint="done">
        </div>
        <p class="msg" id="msg"></p>
        <button class="btn-answer" id="submitBtn">こたえる</button>
        <div class="row">
          <button class="btn-hint" id="hintBtn"><img src="assets/img/hint.webp" alt="">ヒント −10点</button>
          <button class="btn-giveup" id="giveupBtn">こたえを見る</button>
        </div>
        <p class="worth">この問題は <b id="worth"></b> 点</p>
      </div>

      <div id="doneArea" class="done" hidden>
        <p class="reveal" id="reveal"></p>
        <p class="gain" id="gain"></p>
        <button class="btn-next" id="nextBtn">つぎへ</button>
      </div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="result" hidden>
    <img class="kusudama" src="assets/img/kusudama.webp" alt="">
    <h2>けっか はっぴょう！</h2>
    <p class="drum" id="drum"></p>
    <div id="resultBody" hidden>
      <p class="final"><span id="finalScore">0</span><small>点</small></p>
      <p class="rank" id="rank"></p>
      <p class="record" id="record"></p>
      <div class="res" id="resList"></div>
      <div class="stack">
        <button class="btn-start" id="againBtn" style="animation:none">もういちど</button>
        <button class="btn-sub" id="homeBtn">はじめの画面へ</button>
      </div>
    </div>
  </section>

  <!-- QRから追加 -->
  <section id="importView" hidden>
    <div class="panel">
      <h2><img src="assets/img/family.webp" alt="">家族の問題が とどきました</h2>
      <p id="importLead"></p>
      <ul class="list" id="importList"></ul>
    </div>
    <div class="stack">
      <button class="btn-start" id="importOk" style="animation:none">追加する</button>
      <button class="btn-sub" id="importNo">やめる</button>
    </div>
  </section>

  <!-- 家族の問題の一覧 -->
  <section id="manage" hidden>
    <div class="panel">
      <h2><img src="assets/img/family.webp" alt="">家族の問題</h2>
      <ul class="list" id="familyList"></ul>
      <p class="note" id="familyEmpty">まだありません。家族に見せてもらったQRコードをスマホのカメラで読むと追加されます。</p>
    </div>
    <button class="btn-sub" id="manageBack">もどる</button>
  </section>

</main>

<div class="overlay" id="overlay" hidden><img id="overlayImg" alt=""></div>

<script src="common.js"></script>
<script src="questions.js"></script>
<script src="sound.js"></script>
<script>
  const QUESTION_COUNT = 10;
  const FAMILY_PER_GAME = 3;
  const POINT = 10;
  const CAT_IMG = {
    'お笑いコンビ': 'owarai', 'アイドルグループ': 'idol', '流行語大賞': 'ryukogo',
    'SMAPのドラマ': 'drama', '家族の問題': 'family',
  };

  const $ = id => document.getElementById(id);
  const views = ['home', 'play', 'result', 'importView', 'manage'];
  function show(id) {
    views.forEach(v => { $(v).hidden = v !== id; });
    window.scrollTo(0, 0);
  }

  let family = loadJSON(STORE_FAMILY, []);
  let game = null;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 同じ答えの問題が1回のゲームに2つ出ないようにする
  function pickQuestions() {
    const picked = [];
    const used = new Set();
    const take = (pool, max) => {
      for (const q of shuffle(pool)) {
        if (picked.length >= QUESTION_COUNT || max <= 0) break;
        if (used.has(q.kana)) continue;
        used.add(q.kana);
        picked.push(q);
        max--;
      }
    };
    take(family, FAMILY_PER_GAME);
    take(GENERAL_QUESTIONS, QUESTION_COUNT);
    return shuffle(picked);
  }

  // ── 音 ──
  function renderSoundBtn() {
    $('soundBtn').textContent = Sound.isOn() ? '🔊 おと あり' : '🔇 おと なし';
  }
  $('soundBtn').onclick = () => {
    Sound.setOn(!Sound.isOn());
    renderSoundBtn();
    if (Sound.isOn() && !$('play').hidden) Sound.bgmStart();
  };

  // ── 正解・不正解の絵と紙ふぶき ──
  let overlayTimer = null;
  function stamp(img, ms) {
    clearTimeout(overlayTimer);
    const ov = $('overlay');
    ov.classList.remove('out');
    $('overlayImg').src = `assets/img/${img}.webp`;
    ov.hidden = false;
    const im = $('overlayImg');
    im.style.animation = 'none';
    void im.offsetWidth;
    im.style.animation = '';
    overlayTimer = setTimeout(() => {
      ov.classList.add('out');
      overlayTimer = setTimeout(() => { ov.hidden = true; }, 300);
    }, ms);
  }

  function confetti(n = 40) {
    const colors = ['#ef5b5b', '#ffb547', '#2fae6b', '#3b8de0', '#c86bdb'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 1.6 + Math.random() * 1.4 + 's';
      c.style.animationDelay = Math.random() * .3 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }

  // ── はじめの画面 ──
  function renderHome() {
    Sound.bgmStop();
    const best = loadJSON(STORE_BEST, null);
    $('bestText').innerHTML = best != null ? `これまでの最高点 <b>${best}</b> 点` : '';
    $('familyCount').textContent = family.length
      ? `家族の問題 ${family.length}問（1回に${Math.min(FAMILY_PER_GAME, family.length)}問まで出ます）`
      : '家族の問題は まだありません';
    show('home');
  }

  function startGame() {
    Sound.stopAll();
    Sound.bgmStart();
    game = { list: pickQuestions(), index: 0, total: 0, max: 0, log: [] };
    show('play');
    renderQuestion();
  }

  // ── 出題 ──
  function current() { return game.list[game.index]; }

  function renderDots() {
    const d = $('dots');
    d.innerHTML = '';
    game.list.forEach((_, i) => {
      const e = document.createElement('i');
      if (i < game.index) e.className = 'done';
      if (i === game.index) e.className = 'now';
      d.appendChild(e);
    });
  }

  function renderQuestion() {
    const q = current();
    game.revealed = 1;
    renderDots();
    $('progress').textContent = `${game.index + 1}問め / ${game.list.length}問`;
    $('total').textContent = `${game.total}点`;
    $('cat').textContent = q.cat;
    $('catImg').src = `assets/img/${CAT_IMG[q.cat] || 'title'}.webp`;
    $('qText').textContent = q.q;
    $('qClue').textContent = q.hint ? `💡 ${q.hint}` : '';
    $('qClue').hidden = !q.hint;
    $('answer').value = '';
    $('msg').textContent = '';
    $('answerArea').hidden = false;
    $('doneArea').hidden = true;
    renderBoxes(false);
    Sound.play('question', 0.6);
    setTimeout(() => $('answer').focus(), 50);
  }

  function renderBoxes(all) {
    const cs = chars(current().kana);
    const box = $('boxes');
    box.innerHTML = '';
    box.classList.toggle('long', cs.length > 6);
    cs.forEach((c, i) => {
      const s = document.createElement('span');
      if (i === 0) { s.textContent = c; s.className = 'open'; }
      else if (i < game.revealed) { s.textContent = c; s.className = 'hinted'; }
      else if (all) { s.textContent = c; s.className = 'ans'; s.style.animationDelay = (i - game.revealed) * 60 + 'ms'; }
      box.appendChild(s);
    });
    $('prefix').textContent = cs.slice(0, game.revealed).join('');
    $('worth').textContent = worth();
    $('hintBtn').disabled = game.revealed >= cs.length - 1;
  }

  function worth() {
    return (chars(current().kana).length - game.revealed) * POINT;
  }

  function isCorrect(input) {
    const q = current();
    const n = normalizeAnswer(input);
    if (!n) return false;
    const prefix = chars(q.kana).slice(0, game.revealed).join('');
    const answers = [q.kana].concat(q.alt || []).map(normalizeAnswer);
    return answers.includes(n) || normalizeAnswer(q.kana) === normalizeAnswer(prefix + n);
  }

  function submit() {
    if ($('answerArea').hidden) return;
    const input = $('answer').value;
    if (!normalizeAnswer(input)) {
      $('msg').textContent = 'つづきを入力してね';
      return;
    }
    if (isCorrect(input)) {
      finish(worth(), true);
    } else {
      Sound.play('wrong');
      stamp('batsu', 700);
      $('msg').textContent = 'ざんねん！ もういちど';
      const line = $('answerLine');
      line.classList.remove('shake');
      void line.offsetWidth;
      line.classList.add('shake');
      $('answer').select();
    }
  }

  function hint() {
    const len = chars(current().kana).length;
    if (game.revealed >= len - 1) return;
    game.revealed++;
    Sound.play('button', 0.7);
    $('answer').value = '';
    $('msg').textContent = '';
    renderBoxes(false);
    $('answer').focus();
  }

  function finish(points, ok) {
    const q = current();
    game.total += points;
    game.max += (chars(q.kana).length - 1) * POINT;
    game.log.push({ q: q.q, display: q.display, points });
    $('answer').blur();
    $('answerArea').hidden = true;
    $('doneArea').hidden = false;
    $('reveal').textContent = q.display;
    $('gain').textContent = ok ? `せいかい！ ＋${points}点` : 'こたえは これでした';
    $('gain').style.color = ok ? '' : 'var(--sub)';
    $('total').textContent = `${game.total}点`;
    renderBoxes(true);
    if (ok) {
      Sound.play('correct');
      stamp('maru', 1100);
      confetti();
    }
    $('nextBtn').textContent = game.index + 1 >= game.list.length ? 'けっかを見る' : 'つぎへ';
  }

  function next() {
    game.index++;
    if (game.index >= game.list.length) return renderResult();
    renderQuestion();
  }

  // ── 結果 ──
  function rankText(ratio) {
    if (ratio >= 0.8) return 'すばらしい！ あたまピカピカ！';
    if (ratio >= 0.55) return 'よくできました！';
    if (ratio >= 0.3) return 'いい調子です！';
    return 'またちょうせんしてね！';
  }

  function renderResult() {
    show('result');
    $('resultBody').hidden = true;
    $('drum').textContent = 'ドゥルルルル…';
    Sound.duck(true);
    const drum = Sound.play('drum', 0.8);
    const wait = drum ? 2600 : 900;
    setTimeout(() => {
      if (drum) drum.pause();
      Sound.play('jajean');
      Sound.duck(false);
      $('drum').textContent = '';
      revealResult();
    }, wait);
  }

  function revealResult() {
    const best = loadJSON(STORE_BEST, null);
    const isBest = best == null || game.total > best;
    if (isBest) saveJSON(STORE_BEST, game.total);
    $('rank').textContent = rankText(game.max ? game.total / game.max : 0);
    $('record').textContent = isBest ? '★ さいこう記録です！' : `これまでの最高点 ${best}点`;
    $('record').className = isBest ? 'record new' : 'record';
    const list = $('resList');
    list.innerHTML = '';
    game.log.forEach((r, i) => {
      const row = document.createElement('div');
      const q = document.createElement('span');
      q.className = 'q';
      q.textContent = `${i + 1}. ${r.q}`;
      const a = document.createElement('span');
      a.className = 'a';
      a.textContent = r.display;
      q.appendChild(a);
      const p = document.createElement('span');
      p.className = r.points ? 'p' : 'p zero';
      p.textContent = `${r.points}点`;
      row.append(q, p);
      list.appendChild(row);
    });
    $('resultBody').hidden = false;
    confetti(70);
    // 点数をカウントアップ
    const target = game.total;
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / 1000);
      $('finalScore').textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ── 家族の問題 ──
  function renderManage() {
    Sound.bgmStop();
    const ul = $('familyList');
    ul.innerHTML = '';
    family.forEach((q, i) => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = q.q;
      const del = document.createElement('button');
      del.className = 'btn-danger';
      del.textContent = 'けす';
      del.onclick = () => {
        if (!confirm(`「${q.q}」をけしますか？`)) return;
        family.splice(i, 1);
        saveJSON(STORE_FAMILY, family);
        renderManage();
      };
      li.append(span, del);
      ul.appendChild(li);
    });
    $('familyEmpty').hidden = family.length > 0;
    show('manage');
  }

  // QRコードで開いたとき（URL の #add=...）
  function checkImport() {
    const m = location.hash.match(/^#add=(.+)$/);
    if (!m) return false;
    history.replaceState(null, '', location.pathname + location.search);
    let incoming;
    try {
      incoming = decodeFamily(m[1]);
    } catch (e) {
      alert('QRコードが読めませんでした。もういちど読みとってください。');
      return false;
    }
    const known = new Set(family.map(q => q.q + '|' + q.kana));
    const fresh = incoming.filter(q => !known.has(q.q + '|' + q.kana));
    $('importLead').textContent = fresh.length
      ? `新しい問題が ${fresh.length}問 あります。追加しますか？`
      : 'この問題はもう全部入っています。';
    const ul = $('importList');
    ul.innerHTML = '';
    fresh.forEach(q => {
      const li = document.createElement('li');
      li.textContent = q.q;
      ul.appendChild(li);
    });
    $('importOk').hidden = !fresh.length;
    $('importOk').onclick = () => {
      family = family.concat(fresh);
      if (!saveJSON(STORE_FAMILY, family)) alert('保存できませんでした。ブラウザの設定を確認してください。');
      renderHome();
    };
    show('importView');
    return true;
  }

  $('startBtn').onclick = startGame;
  $('submitBtn').onclick = submit;
  $('hintBtn').onclick = hint;
  $('giveupBtn').onclick = () => finish(0, false);
  $('nextBtn').onclick = next;
  $('againBtn').onclick = startGame;
  $('homeBtn').onclick = renderHome;
  $('manageBtn').onclick = renderManage;
  $('manageBack').onclick = renderHome;
  $('importNo').onclick = renderHome;
  $('answer').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
  });
  window.addEventListener('hashchange', checkImport);
  // 画面を切り替えたらBGMを止める（スマホのバッテリー対策）
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) Sound.bgmStop();
    else if (!$('play').hidden) Sound.bgmStart();
  });

  renderSoundBtn();
  if (!checkImport()) renderHome();
</script>
</body>
</html>
